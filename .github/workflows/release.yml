name: 릴리스

# pyproject.toml의 version을 올린 커밋이 main에 들어올 때만 릴리스가 만들어진다.
# 같은 버전으로 다시 푸시하면 아래 중복 확인에서 걸려 빌드 없이 끝난다.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 릴리스 DMG의 실행 하한을 정하는 것이 이 스텝이다. py2app은 이 Python이 링크한 dylib을
      # 번들에 복사하는데, setup-python의 macOS 3.11은 python.org의 macos11 universal2 pkg라
      # 번들되는 OpenSSL까지 전부 minos 11.0이다(실측: 티켓 6ad582ef). Homebrew Python으로
      # 로컬에서 만들면 그 맥의 OS 버전이 하한이 되므로, 배포용 DMG는 여기서만 만든다.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 버전 읽기 · 릴리스 중복 확인
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["tool"]["poetry"]["version"])')
          [ -n "$VERSION" ] || { echo "::error::pyproject.toml에서 version을 읽지 못했습니다."; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::notice::v$VERSION 릴리스가 이미 있어 빌드를 건너뜁니다. 릴리스하려면 pyproject.toml의 version을 올리세요."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION 릴리스가 없습니다. 빌드합니다."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # secret이 하나라도 없으면 미서명 DMG가 릴리스에 올라간다(build_dmg.sh는 인증서가 없으면
      # 경고만 남기고 계속 빌드한다). 그러니 빌드 앞에서 죽인다.
      # skip=true(버전 안 올린 평범한 푸시)일 때는 건너뛴다 — 빌드도 안 하는데 빨간 X를 남길 이유가 없다.
      - name: 릴리스 secret 확인
        if: steps.check.outputs.skip == 'false'
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          AC_KEY_ID: ${{ secrets.AC_KEY_ID }}
          AC_ISSUER_ID: ${{ secrets.AC_ISSUER_ID }}
          AC_KEY_P8_BASE64: ${{ secrets.AC_KEY_P8_BASE64 }}
        run: |
          MISSING=""
          for NAME in CERT_P12_BASE64 CERT_PASSWORD TEAM_ID AC_KEY_ID AC_ISSUER_ID AC_KEY_P8_BASE64; do
            [ -n "${!NAME}" ] || MISSING="$MISSING $NAME"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::릴리스에 필요한 secret이 비어 있습니다:$MISSING (저장소 Settings → Secrets and variables → Actions에서 넣으세요. README의 '릴리스' 절 참고)"
            exit 1
          fi
          echo "필요한 secret이 모두 있습니다."

      # GitHub 러너 키체인에는 인증서가 없다. secret의 .p12를 임시 키체인에 넣어 codesign이 찾게 한다.
      # set-key-partition-list를 빼먹으면 codesign이 비밀번호 프롬프트를 띄우려다 errSecInternalComponent로 죽는다.
      - name: 서명 인증서 임시 키체인에 넣기
        if: steps.check.outputs.skip == 'false'
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          P12="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PASSWORD=$(uuidgen)   # 러너 안에서만 사는 값이라 이 스텝 밖으로 내보내지 않는다

          echo "$CERT_P12_BASE64" | base64 -D > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"   # 빌드 도중 자동 잠금 금지
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          # 기존 검색 경로를 유지한 채 임시 키체인을 앞에 붙인다(-s는 목록을 통째로 갈아치운다).
          # 따옴표뿐 아니라 공백까지 지우는 건 취향이 아니다: list-keychains 출력은 들여쓰기가 붙어 나오고,
          # 선행 공백이 남은 경로를 -s로 넣으면 security가 상대경로로 보고 "/Library/Keychains/"를 앞에
          # 붙여 존재하지 않는 항목을 만든다(실측 확인). 그러면 login.keychain이 검색 경로에서 빠진다.
          # ponytail: 경로에 공백이 있으면 이 방식이 깨진다 — 러너 경로에는 없다. 깨지면 xargs로 바꾸면 된다.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '" ')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          rm -f "$P12"

          # 인증서가 실제로 잡혔는지 눈으로 보는 줄. 여기 이름이 안 나오면 아래 빌드는 미서명이 된다.
          security find-identity -v -p codesigning

      # ponytail: 설치·빌드를 한 스텝에 몰았다. if 조건이 하나면 되고 로그도 한 덩어리다.
      # 천장: poetry 캐시가 없어 매번 새로 받는다(2~3분). 릴리스는 버전 올릴 때만 도니 아직 아깝지 않다 —
      # 릴리스가 잦아지면 actions/cache로 ~/Library/Caches/pypoetry를 잡으면 된다.
      - name: DMG 빌드
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          pip install poetry
          poetry install
          ./scripts/build_dmg.sh

      # 서명만으로는 다운로드한 사용자에게 Gatekeeper 경고가 그대로 뜬다. 공증 + staple까지 해야
      # 인터넷 없이도 검증이 통과한다. 반드시 릴리스 업로드 **앞**이다 — 뒤집으면 경고가 남은 파일이 올라간다.
      # 애플 서버 대기 때문에 이 스텝만 2~10분 걸린다. 정상이다.
      - name: 공증 · staple
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          AC_KEY_ID: ${{ secrets.AC_KEY_ID }}
          AC_ISSUER_ID: ${{ secrets.AC_ISSUER_ID }}
          AC_KEY_P8_BASE64: ${{ secrets.AC_KEY_P8_BASE64 }}
        run: |
          KEY="$RUNNER_TEMP/ac_key.p8"
          DMG="jaso-$VERSION.dmg"
          echo "$AC_KEY_P8_BASE64" | base64 -D > "$KEY"

          # submit 자체가 실패해도(인증 오류·네트워크) 여기서 죽지 않고 아래 status 분기로 간다 —
          # 그래야 사유를 찍고 죽을 수 있다.
          SUBMIT=$(xcrun notarytool submit "$DMG" --key "$KEY" --key-id "$AC_KEY_ID" --issuer "$AC_ISSUER_ID" --wait --output-format json) || true
          echo "$SUBMIT"

          # JSON이 아니면(=submit이 애플 서버에 닿지도 못했다) 빈 값이 나오고 아래에서 죽는다.
          field() { printf '%s' "$SUBMIT" | python3 -c "import json,sys;print(json.load(sys.stdin).get('$1',''))" 2>/dev/null || true; }
          ID=$(field id)
          STATUS=$(field status)

          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::공증이 통과하지 못했습니다(status=${STATUS:-알 수 없음}). 아래 notarytool 로그가 반려 사유입니다."
            if [ -n "$ID" ]; then
              xcrun notarytool log "$ID" --key "$KEY" --key-id "$AC_KEY_ID" --issuer "$AC_ISSUER_ID" || true
            else
              echo "제출 ID를 받지 못해 로그를 가져올 수 없습니다. 위 submit 출력이 전부입니다."
            fi
            exit 1
          fi

          # staple: 공증 티켓을 DMG에 박아 사용자가 오프라인에서도 검증되게 한다.
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          # 사용자가 DMG를 여는 그 경로(-t open)로 Gatekeeper를 실제로 태워 본다. 여기서 죽으면 릴리스는 안 올라간다.
          spctl -a -t open --context context:primary-signature -vv "$DMG"

      - name: 릴리스 생성
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          gh release create "v$VERSION" "jaso-$VERSION.dmg" --generate-notes

      # 실패해도 러너에 인증서·키를 남기지 않는다. 키체인을 지우면 검색 경로에서도 함께 빠진다.
      - name: 키체인 · 인증서 파일 정리
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/ac_key.p8"
